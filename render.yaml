services:
  - type: web
    name: fastapi-bq-app
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -k uvicorn.workers.UvicornWorker main:app --bind 0.0.0.0:10000
    plan: free
    envVars:
      - key: GCP_CREDENTIALS_JSON
        sync: false  # You'll set this manually via Render dashboard
